<div class="home-container">
  <div class="logo-area">
    <div class="logo-grid">
      <span class="logo-x">X</span>
      <span class="logo-sep">·</span>
      <span class="logo-o">O</span>
    </div>
    <h1>CASCADE</h1>
  </div>

  <div class="rules-card">
    <h2>HOW TO PLAY</h2>
    <ul>
      <li>The board has <strong>9 mini-boards</strong> arranged in a 3×3 grid</li>
      <li>Where you play <strong>determines</strong> your opponent's next board</li>
      <li>A <strong>draw</strong> on a mini-board resets it automatically</li>
      <li>Win <strong>3 mini-boards in a row</strong> to win the game</li>
    </ul>
  </div>

  <button class="play-btn" (click)="startGame()">
    <span class="play-text">PLAY NOW</span>
  </button>

  <p class="bytwo-credit">made by <span class="bytwo-name">bytwo</span></p>
</div>
